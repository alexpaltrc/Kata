[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Alex Palacios"]
publish = false

[workspace.dependencies]
kata-capture = { path = "crates/capture" }
kata-editor = { path = "crates/editor" }
kata-ui = { path = "crates/ui" }
windows = "0.62.2"
windows-numerics = "0.3.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
